<!DOCTYPE html>
<html lang="en" data-theme="simple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ada's Graphic Novel Creator</title>
    <script>
      // Pick the saved look before anything is drawn, so the page never flashes the other one.
      try {
        if (localStorage.getItem('gn-look') === 'crafty') document.documentElement.dataset.theme = 'crafty';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Baloo+2:wght@500;700&family=Bangers&family=Comic+Neue:wght@400;700&family=Patrick+Hand&family=Zilla+Slab:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studio/main.jsx"></script>
  </body>
</html>
